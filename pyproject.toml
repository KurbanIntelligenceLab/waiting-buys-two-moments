[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "wtm"
version = "2026.10"
description = "Reference implementation for 'Waiting Buys Exactly Two Moments: Endogenous Identification in Prediction-Driven Allocation'"
readme = "README.md"
requires-python = ">=3.11"
# No license is declared yet: the authors have not chosen one.
# Author metadata lives in CITATION.cff; publication packaging is on main.
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "pandas>=2.0",
  "PyYAML>=6.0",
  "matplotlib>=3.7",
  "highspy>=1.7",
  "mpmath>=1.3",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools]
packages = ["wtm", "experiments", "experiments.scripts", "experiments.audit", "experiments.em_mechanism"]

[tool.setuptools.package-data]
experiments = ["config/*.yaml"]
"experiments.em_mechanism" = ["*.md"]   # README and the frozen protocols

[tool.pytest.ini_options]
testpaths = ["experiments/tests"]
